<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Platform Title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-brand: 'Fieldwork Geo', 'Fieldwork', 'Noto Sans', Arial, sans-serif;
      --castrol-green: #009343;
      --castrol-green-dark: #007A37;
      --castrol-green-soft: #F2FAF4;
      --castrol-green-border: #BCE6C4;
      --castrol-red: #F00023;
      --castrol-red-soft: #FEF2F2;
      --castrol-red-border: #FECACA;
      --castrol-header: #0C9547;
      --canvas-bg: #0F1722;
      --text-main: #111827;
      --text-sub: #6B7280;
      --border-neutral: #E5E7EB;
      --disabled-bg: #D9D9D9;
      --disabled-text: #8C8C8C;
      --whatsapp-green: #25D366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-brand);
      background-color: var(--canvas-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    /* CLEAN FRAMELESS MOBILE-ASPECT-RATIO VIEWPORT */
    .mobile-screen {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: var(--castrol-header);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    @media (min-width: 440px) {
      body {
        padding: 16px;
      }
      .mobile-screen {
        border-radius: 20px;
      }
    }

    /* APP TOP HEADER (GREEN WITH CENTERED CASTROL MAGNATEC LOGO) */
    .app-top-bar {
      height: 82px;
      padding: 11px 18px 0;
      background: #0C9547;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
    }

    .back-circle-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #68C07A;
      border: 1.5px solid #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #FFFFFF;
      transition: transform 0.12s ease;
    }

    .back-circle-btn:hover {
      transform: scale(1.04);
    }

    .header-logo-center {
      width: 148px;
      height: 42px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo-center svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hamburger-box-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #68C07A;
      border: 1.5px solid #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .hamburger-box-btn:hover {
      opacity: 0.9;
    }

    .hamburger-box-btn span {
      width: 14px;
      height: 1.8px;
      background: #FFFFFF;
      border-radius: 2px;
      display: block;
    }

    /* WHITE ROUNDED SHEET BODY — FULL-HEIGHT PROPORTIONAL DISTRIBUTION */
    .white-sheet {
      flex: 1;
      background: #FFFFFF;
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .sheet-body::-webkit-scrollbar {
      width: 4px;
    }
    .sheet-body::-webkit-scrollbar-thumb {
      background: #E5E7EB;
      border-radius: 4px;
    }

    .screen-header-block {
      flex-shrink: 0;
    }

    .screen-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--castrol-green);
      line-height: 1.15;
      letter-spacing: 0;
      margin-bottom: 5px;
    }

    .screen-subtitle {
      font-size: 13px;
      font-weight: 300;
      color: var(--text-main);
      line-height: 1.4;
    }

    /* BOTTOM STICKY CTA BAR */
    .sheet-footer {
      padding: 14px 20px 22px;
      background: #FFFFFF;
      border-top: 1px solid #F3F4F6;
      flex-shrink: 0;
    }

    .primary-cta {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      border: none;
      background: var(--castrol-green);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 147, 67, 0.2);
    }

    .primary-cta:hover:not(:disabled) {
      background: var(--castrol-green-dark);
    }

    .primary-cta:disabled {
      background: var(--disabled-bg);
      color: var(--disabled-text);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* SCREEN 1: WHITE BACKGROUND SPLASH LANDING */
    .splash-sheet {
      flex: 1;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 24px 28px;
      color: #000000;
      position: relative;
      overflow: hidden;
    }

    .splash-center {
      margin: auto 0;
      text-align: center;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .castrol-hero-logo {
      width: 227px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .castrol-hero-logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .splash-subtitle-black {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.35;
      color: #000000;
      letter-spacing: 0;
    }

    /* SCREEN 2: COMPACT INPUT FIELDS WITH CHARACTER LIMITS */
    .form-fields-stack {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
      padding: 0;
    }

    .input-wrap {
      position: relative;
      width: 100%;
    }

    .input-box {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: 1.5px solid var(--border-neutral);
      padding: 0 58px 0 14px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text-main);
      background: #FFFFFF;
      transition: all 0.15s ease;
      outline: none;
    }

    .input-box::placeholder {
      color: #9CA3AF;
      font-weight: 400;
    }

    .input-box:focus {
      border-color: var(--castrol-green);
      box-shadow: 0 0 0 3px rgba(0, 147, 67, 0.12);
    }

    .input-box.error {
      border-color: var(--castrol-red);
      background: #FFFBFB;
    }

    .char-counter {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10.5px;
      font-weight: 600;
      color: #9CA3AF;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    .char-counter.at-limit {
      color: var(--castrol-green);
    }

    .field-helper.error-text {
      font-size: 11.5px;
      color: var(--castrol-red);
      font-weight: 600;
    }

    .consents-stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
    }

    .consent-card {
      border: 1px solid var(--border-neutral);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: #FFFFFF;
    }

    .consent-card.checked {
      border-color: var(--castrol-green);
      background: var(--castrol-green-soft);
    }

    .consent-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid #9CA3AF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #fff;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .consent-card.checked .consent-checkbox {
      background: var(--castrol-green);
      border-color: var(--castrol-green);
    }

    .consent-copy {
      font-size: 12px;
      line-height: 1.38;
      color: #1F2937;
      font-weight: 400;
    }

    /* SCREEN 3: PROPORTIONAL PHOTO + AUDIO STUDIO */
    .section-card {
      border: 1px solid var(--border-neutral);
      border-radius: 16px;
      padding: 15px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .section-card.voice-card {
      flex: 1;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-step-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-num-badge {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--castrol-green);
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .valid-pill {
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #10B981;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
    }

    /* PHOTO SECTION GRID */
    .photo-compact-grid {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 12px;
      align-items: stretch;
    }

    .photo-thumb-box {
      width: 112px;
      height: 112px;
      border-radius: 14px;
      background: var(--castrol-green-soft);
      border: 1.5px dashed var(--castrol-green-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .photo-thumb-box.has-photo {
      border-style: solid;
      border-color: var(--castrol-green);
    }

    .photo-actions-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .compact-action-btn {
      flex: 1;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border-neutral);
      background: #FFFFFF;
      padding: 0 13px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .compact-action-btn:hover {
      border-color: var(--castrol-green);
      background: var(--castrol-green-soft);
    }

    .mini-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--castrol-green-soft);
      color: var(--castrol-green);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 100-WORD LOREM IPSUM SCRIPT BOX */
    .script-box-compact {
      flex: 1;
      background: var(--castrol-green-soft);
      border: 1px solid var(--castrol-green-border);
      border-radius: 13px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    .script-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--castrol-green-dark);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .script-scroll-area {
      flex: 1;
      max-height: 175px;
      overflow-y: auto;
      padding-right: 4px;
      font-size: 12.5px;
      line-height: 1.55;
      color: #1F2937;
      font-weight: 400;
    }

    .script-scroll-area::-webkit-scrollbar {
      width: 3px;
    }
    .script-scroll-area::-webkit-scrollbar-thumb {
      background: var(--castrol-green-border);
      border-radius: 4px;
    }

    .script-highlight {
      background: #BCE6C4;
      color: #004D21;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .rec-ctrl-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--castrol-red);
      background: #FFFFFF;
      color: var(--castrol-red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
      box-shadow: 0 3px 10px rgba(240, 0, 35, 0.18);
    }

    .rec-ctrl-icon-btn.active-stop {
      background: var(--castrol-red);
      color: #FFFFFF;
    }

    .skip-audio-note {
      font-size: 11.5px;
      color: var(--text-sub);
      text-align: center;
      margin-top: 8px;
    }

    .skip-audio-note button {
      background: none;
      border: none;
      color: var(--castrol-green);
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
      text-decoration: underline;
      font-family: inherit;
    }

    /* PHASED FADE FOR VOICE SECTION BEFORE PHOTO IS UPLOADED */
    .section-card.phase-locked {
      opacity: 0.42;
      pointer-events: none;
      filter: grayscale(0.25);
      transition: opacity 0.25s ease, filter 0.25s ease;
    }

    /* COLLAPSIBLE GUIDELINE BOX WITH CROSS BUTTON FOR PHOTO & AUDIO */
    .guideline-collapse-box {
      background: var(--castrol-green-soft);
      border: 1px solid var(--castrol-green-border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .guideline-collapse-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .guideline-collapse-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--castrol-green-dark);
    }

    .guideline-close-x {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--castrol-green-border);
      background: #FFFFFF;
      color: var(--castrol-green-dark);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .guideline-list-items {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .guideline-list-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 11.5px;
      line-height: 1.35;
      color: #1F2937;
    }

    .guideline-list-row .mini-tick {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      background: var(--castrol-green);
      color: #FFFFFF;
      font-size: 9.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .guideline-reopen-bar {
      background: var(--castrol-green-soft);
      border: 1px dashed var(--castrol-green-border);
      border-radius: 10px;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--castrol-green-dark);
    }

    /* DEDICATED DEFAULT AUDIO BUTTON WITH CLEAR LETTER SPACING */
    .default-audio-btn {
      width: 100%;
      height: 42px;
      border-radius: 10px;
      border: 1.5px dashed var(--castrol-green);
      background: var(--castrol-green-soft);
      color: var(--castrol-green-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      word-spacing: 0.08em;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .default-audio-btn:hover {
      background: #E2F5E7;
      border-style: solid;
    }

    .audio-dual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .audio-ready-bar {
      background: #F9FAFB;
      border: 1px solid var(--border-neutral);
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .waveform-mini {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 22px;
    }

    .waveform-mini span {
      width: 3px;
      background: var(--castrol-green);
      border-radius: 99px;
      display: inline-block;
    }

    .waveform-mini.recording span {
      background: var(--castrol-red);
      animation: pulseBar 0.7s infinite alternate;
    }

    .delete-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--castrol-red-border);
      background: var(--castrol-red-soft);
      color: var(--castrol-red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .delete-icon-btn:hover {
      background: #FEE2E2;
    }

    @keyframes pulseBar {
      from { transform: scaleY(0.5); }
      to { transform: scaleY(1.15); }
    }

    /* BRAND GUIDELINES LOADING SCREEN (WHITE 67% / GREEN 30% PATHWAY / RED 2% ACCENT) */
    .brand-loading-screen {
      flex: 1;
      background: #FFFFFF;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 36px 24px 32px;
      overflow: hidden;
    }

    .pathway-bg-graphic {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .loading-content-layer {
      position: relative;
      z-index: 2;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
    }

    .castrol-spinner-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid #EBF0F0;
      border-top-color: var(--castrol-green);
      border-right-color: var(--castrol-red);
      animation: spinCastrol 0.95s linear infinite;
    }

    @keyframes spinCastrol {
      to { transform: rotate(360deg); }
    }

    .loading-headline {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.08;
      color: var(--castrol-green);
      letter-spacing: 0;
    }

    .loading-subcopy {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.45;
      color: #000000;
      max-width: 290px;
    }

    .loading-progress-track {
      width: 100%;
      height: 6px;
      background: #EBF0F0;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .loading-progress-fill {
      height: 100%;
      width: 68%;
      background: var(--castrol-green);
      border-radius: 99px;
      position: relative;
      animation: loadPulse 1.4s ease-in-out infinite alternate;
    }

    .loading-progress-fill::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 12px;
      height: 100%;
      background: var(--castrol-red);
    }

    @keyframes loadPulse {
      from { width: 35%; }
      to { width: 88%; }
    }

    /* MODALS: HOW IT WORKS, CHECKLIST, CAMERA, CROP */
    .screen-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(10, 15, 24, 0.76);
      backdrop-filter: blur(3px);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-card {
      background: #FFFFFF;
      width: 100%;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      animation: popUp 0.18s ease-out;
    }

    @keyframes popUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-close-x {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #F3F4F6;
      border: none;
      font-size: 13px;
      font-weight: 700;
      color: #4B5563;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--castrol-green-soft);
      border: 1px solid var(--castrol-green-border);
      margin-bottom: 9px;
    }

    .check-icon-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--castrol-green);
      color: #FFFFFF;
      font-size: 11.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .check-row-text {
      font-size: 12.5px;
      font-weight: 600;
      color: #111827;
      line-height: 1.35;
    }

    .check-row-text span {
      display: block;
      font-size: 11.5px;
      font-weight: 300;
      color: #4B5563;
    }

    .check-row.pending-check {
      background: #F9FAFB;
      border-color: var(--border-neutral);
    }

    .check-row.pending-check .check-icon-circle {
      background: #E5E7EB;
      color: #9CA3AF;
    }

    /* CAMERA & CROP */
    .camera-viewfinder {
      position: relative;
      width: 100%;
      height: 270px;
      background: #111827;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-guide-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .camera-hint-pill {
      position: absolute;
      top: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .crop-stage {
      position: relative;
      width: 100%;
      height: 250px;
      background: #0F172A;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crop-grid-box {
      position: absolute;
      width: 175px;
      height: 175px;
      border: 2px solid #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.52);
      pointer-events: none;
    }

    .crop-grid-box::before,
    .crop-grid-box::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px dashed rgba(255,255,255,0.45);
    }

    .crop-grid-box::before {
      top: 33.3%;
      bottom: 33.3%;
      border-left: none;
      border-right: none;
    }

    .crop-grid-box::after {
      left: 33.3%;
      right: 33.3%;
      border-top: none;
      border-bottom: none;
    }

    .zoom-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 600;
      color: #4B5563;
    }

    .zoom-slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--castrol-green);
    }

    .dual-decision-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-outline-neutral {
      height: 44px;
      border-radius: 11px;
      border: 1px solid var(--border-neutral);
      background: #FFFFFF;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-outline-valid {
      height: 44px;
      border-radius: 11px;
      border: 1.5px solid #10B981;
      background: #ECFDF5;
      color: #047857;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    /* THANK YOU & GALLERY CARDS */
    .soft-dropzone {
      background: var(--castrol-green-soft);
      border: 1px solid var(--castrol-green-border);
      border-radius: 18px;
      padding: 36px 20px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .upload-squircle {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: var(--castrol-green);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .whatsapp-card {
      border: 1.5px solid #86EFAC;
      background: #F0FDF4;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .wa-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wa-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--whatsapp-green);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toggle-pill {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: var(--castrol-green);
      position: relative;
      cursor: pointer;
      border: none;
      flex-shrink: 0;
    }

    .toggle-pill.off {
      background: #D1D5DB;
    }

    .toggle-knob {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 3px;
      right: 3px;
      transition: all 0.15s ease;
    }

    .toggle-pill.off .toggle-knob {
      right: 23px;
    }

    .list-option-card {
      border: 1px solid var(--border-neutral);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #FFFFFF;
    }

    .list-option-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--castrol-green-soft);
      color: var(--castrol-green);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 15px;
    }

    .list-option-text h4 {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .list-option-text p {
      font-size: 12px;
      color: var(--text-sub);
    }

    .video-card {
      border: 1px solid var(--border-neutral);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .video-thumb {
      flex: 1;
      min-height: 240px;
      background: linear-gradient(135deg, #111827 0%, #064E3B 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .play-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      color: var(--castrol-green);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      cursor: pointer;
    }

    .video-meta {
      padding: 16px;
    }

    /* MULTI-ENTRY GALLERY CARDS */
    .gallery-list {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 12px;
    }

    .gallery-entry-card {
      flex: 1;
      border: 1px solid var(--border-neutral);
      border-radius: 16px;
      padding: 12px;
      background: #FFFFFF;
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 12px;
      align-items: center;
    }

    .gallery-entry-thumb {
      width: 96px;
      height: 100%;
      min-height: 92px;
      border-radius: 12px;
      background: linear-gradient(135deg, #111827 0%, #064E3B 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .gallery-play-mini {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      color: var(--castrol-green);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      box-shadow: 0 4px 10px rgba(0,0,0,0.28);
    }

    .gallery-entry-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      gap: 6px;
    }

    .gallery-entry-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
    }

    .gallery-entry-sub {
      font-size: 11.5px;
      color: var(--text-sub);
    }

    .gallery-entry-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 2px;
    }

    .gallery-btn-sm {
      height: 34px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* LEADING FIRST VIDEO CARD IN MY GALLERY */
    .gallery-lead-card {
      border: 1px solid var(--border-neutral);
      border-radius: 16px;
      overflow: hidden;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
    }

    .gallery-lead-thumb {
      height: 156px;
      background: linear-gradient(135deg, #111827 0%, #064E3B 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .gallery-lead-body {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .gallery-action-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .share-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1.5px solid var(--castrol-green);
      background: var(--castrol-green-soft);
      color: var(--castrol-green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .share-icon-btn:hover {
      background: var(--castrol-green);
      color: #FFFFFF;
    }

    .drawer-sheet {
      position: absolute;
      top: 0;
      right: 0;
      width: 78%;
      height: 100%;
      background: #FFFFFF;
      z-index: 50;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: -10px 0 30px rgba(0,0,0,0.35);
    }

    /* DUMMY LEGAL / INFO PAGES */
    .dummy-copy-card {
      border: 1px solid var(--border-neutral);
      border-radius: 16px;
      padding: 16px;
      background: #F9FAFB;
      flex: 1;
      overflow-y: auto;
      font-size: 12.5px;
      line-height: 1.6;
      color: #374151;
    }

    .dummy-copy-card h4 {
      color: var(--castrol-green);
      font-size: 13.5px;
      font-weight: 700;
      margin: 12px 0 4px;
    }

    .dummy-copy-card h4:first-child {
      margin-top: 0;
    }
  </style>
</head>

                <div class="camera-guide-overlay">
                  <span class="camera-hint-pill">Align face inside outline</span>
                  <svg width="200" height="220" viewBox="0 0 200 220" fill="none" style="margin-top:16px;">
                    <path d="M25 40 V22 H45" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
                    <path d="M175 40 V22 H155" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
                    <path d="M25 185 V203 H45" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
                    <path d="M175 185 V203 H155" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
                    <ellipse cx="100" cy="92" rx="42" ry="52" stroke="#FFFFFF" stroke-width="2.2" stroke-dasharray="6 5"/>
                    <line x1="68" y1="84" x2="132" y2="84" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
                    <path d="M34 198 C42 158 70 148 100 148 C130 148 158 158 166 198" stroke="#FFFFFF" stroke-width="2.2" stroke-dasharray="6 5" stroke-linecap="round"/>
                  </svg>
                </div>
              </div>

              <div class="dual-decision-row">
                <button class="btn-outline-neutral" onclick="closePhotoModal()">Cancel</button>
                <button class="primary-cta" style="height:44px; font-size:13.5px;" onclick="captureFromCamera()">
                  Capture & Crop
                </button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.photoModal === 'crop') {
        html += `
          <div class="screen-modal-backdrop">
            <div class="modal-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span style="font-size:14px; font-weight:700; color:var(--castrol-green);">Crop photo</span>
                <button class="modal-close-x" onclick="closePhotoModal()">✕</button>
              </div>

              <div class="crop-stage">
                <div style="width:250px; height:250px;">
                  ${getMechanicPortraitSVG(state.cropZoom)}
                </div>
                <div class="crop-grid-box"></div>
              </div>

              <div class="zoom-slider-row">
                <span>Crop Zoom</span>
                <input type="range" min="1" max="1.45" step="0.05" value="${state.cropZoom}" oninput="updateCropZoom(this.value)" />
                <span>${Math.round(state.cropZoom * 100)}%</span>
              </div>

              <div class="dual-decision-row">
                <button class="btn-outline-neutral" onclick="closePhotoModal()">Cancel</button>
                <button class="primary-cta" style="height:44px; font-size:13.5px;" onclick="applyPhotoCrop()">
                  Apply Crop ✓
                </button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.showLimitModal) {
        html += `
          <div class="screen-modal-backdrop">
            <div class="modal-card" style="text-align:center;">
              <div style="display:flex; justify-content:flex-end; margin-bottom:4px;">
                <button class="modal-close-x" onclick="toggleLimitModal(false)">✕</button>
              </div>
              <div style="width:48px; height:48px; border-radius:14px; background:var(--castrol-red-soft); color:var(--castrol-red); display:flex; align-items:center; justify-content:center; margin:0 auto 10px; font-size:20px; font-weight:800; border:1px solid var(--castrol-red-border);">
                !
              </div>
              <h3 style="font-size:17px; font-weight:700; color:#111827; margin-bottom:6px;">
                Attempt limit reached
              </h3>
              <p style="font-size:12.5px; color:#4B5563; line-height:1.45; margin-bottom:16px;">
                You have exhausted all 3 available attempts. You can view and share your generated videos in <strong>My Gallery</strong>.
              </p>
              <button class="primary-cta" style="height:44px;" onclick="toggleLimitModal(false); openMenuPage(5);">
                Go to My Gallery
              </button>
            </div>
          </div>
        `;
      }

      // HAMBURGER MENU: ONLY MY GALLERY, HOW IT WORKS, TERMS AND CONDITIONS, PRIVACY POLICY (NO ICONS)
      if (state.showMenuDrawer) {
        html += `
          <div class="screen-modal-backdrop" style="padding:0; justify-content:flex-end;" onclick="toggleDrawer(false)">
            <div class="drawer-sheet" onclick="event.stopPropagation()">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                  <div style="width:128px; height:32px; display:flex; align-items:center;">
                    ${CASTROL_PRIMARY_LOGO_SVG}
                  </div>
                  <button class="modal-close-x" onclick="toggleDrawer(false)">✕</button>
                </div>

                <div style="display:flex; flex-direction:column; gap:12px;">
                  <div class="list-option-card" style="cursor:pointer;" onclick="openMenuPage(5)">
                    <div class="list-option-text">
                      <h4>My Gallery</h4>
                      <p>View your personalised videos</p>
                    </div>
                  </div>

                  <div class="list-option-card" style="cursor:pointer;" onclick="openMenuPage(6)">
                    <div class="list-option-text">
                      <h4>How It Works</h4>
                      <p>Step-by-step instructions</p>
                    </div>
                  </div>

                  <div class="list-option-card" style="cursor:pointer;" onclick="openMenuPage(7)">
                    <div class="list-option-text">
                      <h4>Terms and Conditions</h4>
                      <p>Usage & participation rules</p>
                    </div>
                  </div>

                  <div class="list-option-card" style="cursor:pointer;" onclick="openMenuPage(8)">
                    <div class="list-option-text">
                      <h4>Privacy Policy</h4>
                      <p>Data & voice protection</p>
                    </div>
                  </div>
                </div>
              </div>

              <div style="font-size:11px; color:#9CA3AF; text-align:center;">
                Platform Title
              </div>
            </div>
          </div>
        `;
      }

      // NOTIFICATION POPUP MODAL (FOR DOWNLOAD, WHATSAPP, PLAYBACK)
      if (state.notificationModal) {
        html += `
          <div class="screen-modal-backdrop">
            <div class="modal-card" style="text-align:center;">
              <div style="display:flex; justify-content:flex-end; margin-bottom:2px;">
                <button class="modal-close-x" onclick="closeNotification()">✕</button>
              </div>
              <div class="upload-squircle" style="border-radius:50%; width:52px; height:52px; margin:0 auto 12px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <h3 style="font-size:17px; font-weight:700; color:var(--castrol-green); margin-bottom:6px;">
                ${state.notificationModal.title}
              </h3>
              <p style="font-size:13px; color:#374151; line-height:1.45; margin-bottom:16px;">
                ${state.notificationModal.message}
              </p>
              <button class="primary-cta" style="height:44px;" onclick="closeNotification()">
                OK
              </button>
            </div>
          </div>
        `;
      }

      return html;
    }

    function render() {
      const appEl = document.getElementById('appScreen');
      if (state.isLoading) {
        appEl.innerHTML = renderBrandLoadingScreen();
        return;
      }
      if (state.step === 1) appEl.innerHTML = renderStep1();
      else if (state.step === 2) appEl.innerHTML = renderStep2();
      else if (state.step === 3) appEl.innerHTML = renderStep3();
      else if (state.step === 4) appEl.innerHTML = renderStep4();
      else if (state.step === 5) appEl.innerHTML = renderStep5();
      else if (state.step === 6) appEl.innerHTML = renderStep6();
      else if (state.step === 7) appEl.innerHTML = renderStep7();
      else if (state.step === 8) appEl.innerHTML = renderStep8();
    }

    function triggerBrandLoader(headline, subcopy, nextStep, openHowItWorksAfter = false) {
      state.isLoading = true;
      state.loadingHeadline = headline;
      state.loadingSubcopy = subcopy;
      render();
      setTimeout(() => {
        state.isLoading = false;
        state.step = nextStep;
        if (openHowItWorksAfter) {
          state.showInstructionsPopup = true;
        }
        render();
      }, 1100);
    }

    function goToStep(stepNum) {
      state.showInstructionsPopup = false;
      state.showModerationChecklistPopup = false;
      state.showLimitModal = false;
      state.showMenuDrawer = false;
      state.photoModal = null;
      state.step = stepNum;
      render();
    }

    function openMenuPage(targetStep) {
      if (state.step >= 2 && state.step <= 4) {
        state.previousStep = state.step;
      }
      state.showMenuDrawer = false;
      state.showInstructionsPopup = false;
      state.showModerationChecklistPopup = false;
      state.showLimitModal = false;
      state.step = targetStep;
      render();
    }

    function handleFormInput(field, val) {
      const maxLen = FIELD_LIMITS[field] || 100;
      if (field === 'whatsapp') {
        val = val.replace(/[^0-9]/g, '');
      }
      state.form[field] = val.slice(0, maxLen);
      const anyProfane = ['name', 'workshopName', 'workshopAddress'].some(k => checkProfanityText(state.form[k]));
      state.form.profanityError = anyProfane;
      render();
    }

    function toggleConsent(key) {
      state.form[key] = !state.form[key];
      render();
    }

    function submitStep2() {
      triggerBrandLoader(
        'Verifying your details',
        'Running text moderation and preparing your recording studio...',
        3,
        true
      );
    }

    function closeInstructionsToStep3() {
      state.showInstructionsPopup = false;
      state.step = 3;
      render();
    }

    function openModerationChecklist() {
      state.showInstructionsPopup = false;
      state.showMenuDrawer = false;
      state.photoModal = null;
      state.showModerationChecklistPopup = true;
      render();
    }

    function closeModerationChecklist() {
      state.showModerationChecklistPopup = false;
      render();
    }

    function confirmChecklistAndSubmit() {
      state.showModerationChecklistPopup = false;
      triggerBrandLoader(
        'Accelerating your video',
        'Cloning your voice and animating your personalised workshop video...',
        4,
        false
      );
    }

    function openPhotoModal(type) {
      state.photoModal = type;
      render();
    }

    function closePhotoModal() {
      state.photoModal = null;
      render();
    }

    function captureFromCamera() {
      state.photoModal = 'crop';
      render();
    }

    function updateCropZoom(val) {
      state.cropZoom = parseFloat(val);
      render();
    }

    function applyPhotoCrop() {
      state.photo.status = 'uploaded';
      state.photoModal = null;
      render();
    }

    function deletePhoto() {
      state.photo.status = 'empty';
      render();
    }

    function togglePhotoGuidelines(open) {
      state.photo.guidelinesOpen = open;
      render();
    }

    function toggleAudioGuidelines(open) {
      state.audio.guidelinesOpen = open;
      render();
    }

    function startAudioRecording() {
      state.audio.status = 'script_ready';
      state.audio.seconds = 0;
      render();
    }

    function beginMicCapture() {
      state.audio.status = 'recording';
      state.audio.seconds = 18;
      render();
    }

    function finishAudioRecording() {
      state.audio.status = 'recorded';
      state.audio.seconds = 28;
      render();
    }

    function uploadAudioFile() {
      state.audio.status = 'uploaded';
      state.audio.fileName = 'voice_script.m4a (0:28)';
      render();
    }

    function skipAudio() {
      state.audio.status = 'skipped';
      state.audio.fileName = '';
      render();
    }

    function resetAudio() {
      state.audio.status = 'idle';
      state.audio.fileName = '';
      render();
    }

    function toggleWhatsAppOptIn() {
      state.whatsappOptIn = !state.whatsappOptIn;
      render();
    }

    function toggleDrawer(open) {
      state.showMenuDrawer = open;
      render();
    }

    function showNotification(title, message) {
      state.notificationModal = { title, message };
      render();
    }

    function closeNotification() {
      state.notificationModal = null;
      render();
    }

    function toggleLimitModal(open) {
      state.showInstructionsPopup = false;
      state.showModerationChecklistPopup = false;
      state.showMenuDrawer = false;
      state.photoModal = null;
      state.showLimitModal = open;
      render();
    }

    function handleCreateAnotherClick() {
      state.attemptsUsed += 1;
      if (state.attemptsUsed >= state.maxAttempts) {
        toggleLimitModal(true);
      } else {
        state.photo.status = 'empty';
        state.audio.status = 'idle';
        goToStep(3);
      }
    }

    render();
  </script>
</body>
</html>
