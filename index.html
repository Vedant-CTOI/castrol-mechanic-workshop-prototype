<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Platform Title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-brand: 'Fieldwork Geo', 'Fieldwork', 'Noto Sans', Arial, sans-serif;
      --castrol-green: #009343;
      --castrol-green-dark: #007A37;
      --castrol-green-soft: #F2FAF4;
      --castrol-green-border: #BCE6C4;
      --castrol-red: #F00023;
      --castrol-red-soft: #FEF2F2;
      --castrol-red-border: #FECACA;
      --castrol-header: #0C9547;
      --canvas-bg: #0F1722;
      --text-main: #111827;
      --text-sub: #6B7280;
      --border-neutral: #E5E7EB;
      --disabled-bg: #D9D9D9;
      --disabled-text: #8C8C8C;
      --whatsapp-green: #25D366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-brand);
      background-color: var(--canvas-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    /* CLEAN FRAMELESS MOBILE-ASPECT-RATIO VIEWPORT */
    .mobile-screen {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: var(--castrol-header);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    @media (min-width: 440px) {
      body {
        padding: 16px;
      }
      .mobile-screen {
        border-radius: 20px;
      }
    }

    /* APP TOP HEADER (GREEN WITH CENTERED CASTROL MAGNATEC LOGO) */
    .app-top-bar {
      height: 82px;
      padding: 11px 18px 0;
      background: #0C9547;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
    }

    .back-circle-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #68C07A;
      border: 1.5px solid #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #FFFFFF;
      transition: transform 0.12s ease;
    }

    .back-circle-btn:hover {
      transform: scale(1.04);
    }

    .header-logo-center {
      width: 148px;
      height: 42px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo-center svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hamburger-box-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #68C07A;
      border: 1.5px solid #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .hamburger-box-btn:hover {
      opacity: 0.9;
    }

    .hamburger-box-btn span {
      width: 14px;
      height: 1.8px;
      background: #FFFFFF;
      border-radius: 2px;
      display: block;
    }

    /* WHITE ROUNDED SHEET BODY — FULL-HEIGHT PROPORTIONAL DISTRIBUTION */
    .white-sheet {
      flex: 1;
      background: #FFFFFF;
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .sheet-body::-webkit-scrollbar {
      width: 4px;
    }
    .sheet-body::-webkit-scrollbar-thumb {
      background: #E5E7EB;
      border-radius: 4px;
    }

    .screen-header-block {
      flex-shrink: 0;
    }

    .screen-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--castrol-green);
      line-height: 1.15;
      letter-spacing: 0;
      margin-bottom: 5px;
    }

    .screen-subtitle {
      font-size: 13px;
      font-weight: 300;
      color: var(--text-main);
      line-height: 1.4;
    }

    /* BOTTOM STICKY CTA BAR */
    .sheet-footer {
      padding: 14px 20px 22px;
      background: #FFFFFF;
      border-top: 1px solid #F3F4F6;
      flex-shrink: 0;
    }

    .primary-cta {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      border: none;
      background: var(--castrol-green);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 147, 67, 0.2);
    }

    .primary-cta:hover:not(:disabled) {
      background: var(--castrol-green-dark);
    }

    .primary-cta:disabled {
      background: var(--disabled-bg);
      color: var(--disabled-text);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* SCREEN 1: WHITE BACKGROUND SPLASH LANDING */
    .splash-sheet {
      flex: 1;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 24px 28px;
      color: #000000;
      position: relative;
      overflow: hidden;
    }

    .splash-center {
      margin: auto 0;
      text-align: center;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .castrol-hero-logo {
      width: 227px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .castrol-hero-logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .splash-subtitle-black {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.35;
      color: #000000;
      letter-spacing: 0;
    }

    /* SCREEN 2: COMPACT INPUT FIELDS WITH CHARACTER LIMITS */
    .form-fields-stack {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
      padding: 0;
    }

    .input-wrap {
      position: relative;
      width: 100%;
    }

    .input-box {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: 1.5px solid var(--border-neutral);
      padding: 0 58px 0 14px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text-main);
      background: #FFFFFF;
      transition: all 0.15s ease;
      outline: none;
    }

    .input-box::placeholder {
      color: #9CA3AF;
      font-weight: 400;
    }

    .input-box:focus {
      border-color: var(--castrol-green);
      box-shadow: 0 0 0 3px rgba(0, 147, 67, 0.12);
    }

    .input-box.error {
      border-color: var(--castrol-red);
      background: #FFFBFB;
    }

    .char-counter {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10.5px;
      font-weight: 600;
      color: #9CA3AF;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    .char-counter.at-limit {
      color: var(--castrol-green);
    }

    .field-helper.error-text {
      font-size: 11.5px;
      color: var(--castrol-red);
      font-weight: 600;
    }

    .consents-stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
    }

    .consent-card {
      border: 1px solid var(--border-neutral);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: #FFFFFF;
    }

    .consent-card.checked {
      border-color: var(--castrol-green);
      background: var(--castrol-green-soft);
    }

    .consent-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid #9CA3AF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #fff;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .consent-card.checked .consent-checkbox {
      background: var(--castrol-green);
      border-color: var(--castrol-green);
    }

    .consent-copy {
      font-size: 12px;
      line-height: 1.38;
      color: #1F2937;
      font-weight: 400;
    }

    /* SCREEN 3: PROPORTIONAL PHOTO + AUDIO STUDIO */
    .section-card {
      border: 1px solid var(--border-neutral);
      border-radius: 16px;
      padding: 15px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .section-card.voice-card {
      flex: 1;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-step-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-num-badge {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--castrol-green);
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .valid-pill {
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #10B981;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
    }

    /* PHOTO SECTION GRID */
    .photo-compact-grid {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 12px;
      align-items: stretch;
    }

    .photo-thumb-box {
      width: 112px;
      height: 112px;
      border-radius: 14px;
      background: var(--castrol-green-soft);
      border: 1.5px dashed var(--castrol-green-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .photo-thumb-box.has-photo {
      border-style: solid;
      border-color: var(--castrol-green);
    }

    .photo-actions-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .compact-action-btn {
      flex: 1;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border-neutral);
      background: #FFFFFF;
      padding: 0 13px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .compact-action-btn:hover {
      border-color: var(--castrol-green);
      background: var(--castrol-green-soft);
    }

    .mini-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--castrol-green-soft);
      color: var(--castrol-green);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 100-WORD LOREM IPSUM SCRIPT BOX */
    .script-box-compact {
      flex: 1;
      background: var(--castrol-green-soft);
      border: 1px solid var(--castrol-green-border);
      border-radius: 13px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    .script-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--castrol-green-dark);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .script-scroll-area {
      flex: 1;
      max-height: 175px;
      overflow-y: auto;
      padding-right: 4px;
      font-size: 12.5px;
      line-height: 1.55;
      color: #1F2937;
      font-weight: 400;
    }

    .script-scroll-area::-webkit-scrollbar {
      width: 3px;
    }
    .script-scroll-area::-webkit-scrollbar-thumb {
      background: var(--castrol-green-border);
      border-radius: 4px;
    }

    .script-highlight {
      background: #BCE6C4;
      color: #004D21;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .rec-ctrl-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--castrol-red);
      background: #FFFFFF;
      color: var(--castrol-red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
      box-shadow: 0 3px 10px rgba(240, 0, 35, 0.18);
    }

    .rec-ctrl-icon-btn.active-stop {
      background: var(--castrol-red);
      color: #FFFFFF;
    }

    .skip-audio-note {
      font-size: 11.5px;
      color: var(--text-sub);
      text-align: center;
      margin-top: 8px;
    }

    .skip-audio-note button {
      background: none;
      border: none;
      color: var(--castrol-green);
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
      text-decoration: underline;
      font-family: inherit;
    }

    /* PHASED FADE FOR VOICE SECTION BEFORE PHOTO IS UPLOADED */
    .section-card.phase-locked {
      opacity: 0.42;
      pointer-events: none;
      filter: grayscale(0.25);
      transition: opacity 0.25s ease, filter 0.25s ease;
    }

    /* COLLAPSIBLE GUIDELINE BOX WITH CROSS BUTTON FOR PHOTO & AUDIO */
    .guideline-collapse-box {
      background: var(--castrol-green-soft);
      border: 1px solid var(--castrol-green-border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .guideline-collapse-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .guideline-collapse-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--castrol-green-dark);
    }

    .guideline-close-x {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--castrol-green-border);
      background: #FFFFFF;
      color: var(--castrol-green-dark);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .guideline-list-items {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .guideline-list-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 11.5px;
      line-height: 1.35;
      color: #1F2937;
    }

    .guideline-list-row .mini-tick {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      background: var(--castrol-green);
      color: #FFFFFF;
      font-size: 9.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .guideline-reopen-bar {
      background: var(--castrol-green-soft);
      border: 1px dashed var(--castrol-green-border);
      border-radius: 10px;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--castrol-green-dark);
    }

    /* DEDICATED DEFAULT AUDIO BUTTON WITH CLEAR LETTER SPACING */
    .default-audio-btn {
      width: 100%;
      height: 42px;
      border-radius: 10px;
      border: 1.5px dashed var(--castrol-green);
      background: var(--castrol-green-soft);
      color: var(--castrol-green-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      word-spacing: 0.08em;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .default-audio-btn:hover {
      background: #E2F5E7;
      border-style: solid;
    }

    .audio-dual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .audio-ready-bar {
      background: #F9FAFB;
      border: 1px solid var(--border-neutral);
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .waveform-mini {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 22px;
    }

    .waveform-mini span {
      width: 3px;
      background: var(--castrol-green);
      border-radius: 99px;
      display: inline-block;
    }

    .waveform-mini.recording span {
      background: var(--castrol-red);
      animation: pulseBar 0.7s infinite alternate;
    }

    .delete-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--castrol-red-border);
      background: var(--castrol-red-soft);
      color: var(--castrol-red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .delete-icon-btn:hover {
      background: #FEE2E2;
    }

    @keyframes pulseBar {
      from { transform: scaleY(0.5); }
      to { transform: scaleY(1.15); }
    }

    /* BRAND GUIDELINES LOADING SCREEN (WHITE 67% / GREEN 30% PATHWAY / RED 2% ACCENT) */
    .brand-loading-screen {
      flex: 1;
      background: #FFFFFF;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 36px 24px 32px;
      overflow: hidden;
    }

    .pathway-bg-graphic {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .loading-content-layer {
      position: relative;
      z-index: 2;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
    }

    .castrol-spinner-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid #EBF0F0;
      border-top-color: var(--castrol-green);
      border-right-color: var(--castrol-red);
      animation: spinCastrol 0.95s linear infinite;
    }

    @keyframes spinCastrol {
      to { transform: rotate(360deg); }
    }

    .loading-headline {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.08;
      color: var(--castrol-green);
      letter-spacing: 0;
    }

    .loading-subcopy {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.45;
      color: #000000;
      max-width: 290px;
    }

    .loading-progress-track {
      width: 100%;
      height: 6px;
      background: #EBF0F0;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .loading-progress-fill {
      height: 100%;
      width: 68%;
      background: var(--castrol-green);
      border-radius: 99px;
      position: relative;
      animation: loadPulse 1.4s ease-in-out infinite alternate;
    }

    .loading-progress-fill::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 12px;
      height: 100%;
      background: var(--castrol-red);
    }

    @keyframes loadPulse {
      from { width: 35%; }
      to { width: 88%; }
    }

    /* MODALS: HOW IT WORKS, CHECKLIST, CAMERA, CROP */
    .screen-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(10, 15, 24, 0.76);
      backdrop-filter: blur(3px);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-card {
      background: #FFFFFF;
      width: 100%;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      animation: popUp 0.18s ease-out;
    }

    @keyframes popUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-close-x {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #F3F4F6;
      border: none;
      font-size: 13px;
      font-weight: 700;
      color: #4B5563;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--castrol-green-soft);
      border: 1px solid var(--castrol-green-border);
      margin-bottom: 9px;
    }

    .check-icon-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--castrol-green);

    /* CAMERA & CROP */

      height: 270px;

      margin-bottom: 14px;

      align-items: center;
      justify-content: center;
    }

    .camera-guide-overlay {

      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .camera-hint-pill {
      position: absolute;
      top: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .crop-stage {
      position: relative;
      width: 100%;
      height: 250px;
      background: #0F172A;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crop-grid-box {
      position: absolute;
      width: 175px;
      height: 175px;
      border: 2px solid #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.52);
      pointer-events: none;
    }

    .crop-grid-box::before,
    .crop-grid-box::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px dashed rgba(255,255,255,0.45);
    }

    .crop-grid-box::before {
      top: 33.3%;
      bottom: 33.3%;
      border-left: none;
      border-right: none;
    }

    .crop-grid-box::after {
      left: 33.3%;
      right: 33.3%;
      border-top: none;
      border-bottom: none;
    }

    .zoom-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 600;
      color: #4B5563;
    }

    .zoom-slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--castrol-green);
    }

    .dual-decision-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-outline-neutral {
      height: 44px;
      border-radius: 11px;
      border: 1px solid var(--border-neutral);
      background: #FFFFFF;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-outline-valid {
      height: 44px;
      border-radius: 11px;
      border: 1.5px solid #10B981;
      background: #ECFDF5;
      color: #047857;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;

    /* THANK YOU & GALLERY CARDS */

    .upload-squircle {

    .whatsapp-card {

    .toggle-pill {

    .list-option-card {

    .list-option-icon {
      width: 36px;
      height: 36px;

      background: var(--castrol-green-soft);

      align-items: center;
      justify-content: center;

    .list-option-text h4 {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);

    }

    .list-option-text p {
      font-size: 12px;
      color: var(--text-sub);
    }

    .video-card {
      border: 1px solid var(--border-neutral);

      overflow: hidden;
      background: #fff;
      flex: 1;
      display: flex;
      flex-direction: column;

    .video-thumb {

    .play-circle {

    /* MULTI-ENTRY GALLERY CARDS */

    .gallery-play-mini {

    .gallery-entry-title {

    .gallery-entry-sub {

    }

    .gallery-entry-actions {

      grid-template-columns: 1fr 1fr;

    .gallery-btn-sm {
      height: 34px;
      border-radius: 9px;
      font-size: 11.5px;

      align-items: center;
      justify-content: center;

    /* LEADING FIRST VIDEO CARD IN MY GALLERY */
    .gallery-lead-card {
      border: 1px solid var(--border-neutral);
      border-radius: 16px;
      overflow: hidden;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
    }

    .gallery-lead-thumb {
      height: 156px;
      background: linear-gradient(135deg, #111827 0%, #064E3B 100%);

      display: flex;
      align-items: center;

    .gallery-lead-body {
      padding: 12px 14px;

    .gallery-action-row {
      display: flex;

    }

    .share-highlight-btn {
      height: 36px;
      padding: 0 14px;

      border: 1.5px solid var(--castrol-green);

      font-family: inherit;

      align-items: center;
      justify-content: center;

    }

    .share-highlight-btn:hover {
      background: var(--castrol-green-dark);
      border-color: var(--castrol-green-dark);
    }

    .download-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1.5px solid var(--border-neutral);
      background: #FFFFFF;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .download-icon-btn:hover {
      border-color: var(--castrol-green);
      color: var(--castrol-green);
      background: var(--castrol-green-soft);
    }

    .drawer-sheet {
      position: absolute;
      top: 0;
      right: 0;
      width: 78%;

      background: #FFFFFF;

      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: -10px 0 30px rgba(0,0,0,0.35);
    }

    /* DUMMY LEGAL / INFO PAGES */
    .dummy-copy-card {
      border: 1px solid var(--border-neutral);
      border-radius: 16px;
      padding: 16px;
      background: #F9FAFB;
      flex: 1;
      overflow-y: auto;

      color: #374151;

    .dummy-copy-card h4 {
      color: var(--castrol-green);
      font-size: 13.5px;
      font-weight: 700;
      margin: 12px 0 4px;
    }

    .dummy-copy-card h4:first-child {
      margin-top: 0;
    }

    /* ===== CAPTURE FLOW UX (PHOTO + VOICE) ===== */
    .flow-progress { display:flex; flex-direction:column; gap:6px; }
    .flow-progress-top { display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--text-sub); letter-spacing:0.02em; }
    .flow-progress-top b { color:var(--castrol-green); font-weight:700; }
    .flow-track { height:4px; border-radius:4px; background:#E5E7EB; overflow:hidden; }
    .flow-fill { height:100%; background:var(--castrol-green); border-radius:4px; transition:width .3s ease; }

    .tips-card { flex-shrink:0; background:var(--castrol-green-soft); border:1px solid var(--castrol-green-border); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
    .tips-head { display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--castrol-green-dark); }
    .tips-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .tips-col { display:flex; flex-direction:column; gap:5px; }
    .tips-col-title { font-size:11.5px; font-weight:700; padding-bottom:4px; border-bottom:1px solid var(--castrol-green-border); margin-bottom:2px; }
    .tips-col.do .tips-col-title { color:var(--castrol-green-dark); }
    .tips-col.avoid .tips-col-title { color:var(--castrol-red); border-bottom-color:var(--castrol-red-border); }
    .tip-line { font-size:11.5px; line-height:1.35; color:#1F2937; }
    .tips-numbered { display:flex; flex-direction:column; gap:4px; }
    .tips-numbered .tip-line { display:flex; gap:8px; }
    .tips-numbered .tip-line b { color:var(--castrol-green-dark); font-weight:700; min-width:12px; }
    .tips-reopen { align-self:flex-start; background:none; border:none; padding:2px 0; font-family:inherit; font-size:12px; font-weight:700; color:var(--castrol-green); text-decoration:underline; cursor:pointer; }

    .capture-frame { position:relative; width:100%; flex:0 1 236px; min-height:150px; border-radius:16px; border:1.5px dashed var(--castrol-green-border); background:#F8FBF9; overflow:hidden; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .capture-frame .face-outline { max-height:78%; }
    .capture-frame.has-photo { border-style:solid; border-color:var(--castrol-green); cursor:default; flex:1 1 auto; max-height:420px; }
    .capture-frame.is-failed { border-style:solid; border-color:var(--castrol-red); }
    .capture-frame .face-outline { width:170px; height:170px; max-height:78%; margin-top:-18px; }
    .capture-hint { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:12px; font-weight:600; color:var(--castrol-green-dark); }
    .capture-photo { position:absolute; inset:0; }
    .capture-photo svg { width:100%; height:100%; }
    .capture-scan { position:absolute; inset:0; background:rgba(255,255,255,0.55); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; font-size:12.5px; font-weight:700; color:var(--castrol-green-dark); }
    .capture-scan::before { content:""; position:absolute; left:0; right:0; height:3px; background:var(--castrol-green); box-shadow:0 0 14px var(--castrol-green); animation:scanLine 1.4s ease-in-out infinite; }
    @keyframes scanLine { 0% { top:8%; } 50% { top:88%; } 100% { top:8%; } }
    .status-chip { position:absolute; top:10px; left:10px; padding:5px 10px; border-radius:99px; font-size:11px; font-weight:700; }
    .status-chip.ok { background:var(--castrol-green); color:#fff; }
    .status-chip.bad { background:var(--castrol-red); color:#fff; }
    .frame-actions { position:absolute; bottom:10px; left:10px; right:10px; display:flex; gap:8px; }
    .frame-actions button { flex:1; height:34px; border-radius:9px; border:none; background:rgba(255,255,255,0.94); font-family:inherit; font-size:12px; font-weight:700; color:var(--text-main); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:5px; box-shadow:0 2px 6px rgba(0,0,0,0.12); }
    .frame-actions button.icon-only { flex:0 0 34px; color:var(--castrol-red); }

    .cta-stack { display:flex; flex-direction:column; gap:10px; flex-shrink:0; }
    .script-card, .recorder-zone, .skip-zone, .inline-alert, .flow-progress, .default-voice-card { flex-shrink:0; }
    .btn-secondary-outline { width:100%; height:46px; border-radius:12px; border:1.5px solid var(--castrol-green); background:#fff; color:var(--castrol-green); font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    .inline-alert { border-radius:12px; padding:10px 12px; font-size:12px; line-height:1.4; display:flex; gap:8px; align-items:flex-start; }
    .inline-alert.bad { background:var(--castrol-red-soft); border:1px solid var(--castrol-red-border); color:#991B1B; }
    .inline-alert.ok { background:var(--castrol-green-soft); border:1px solid var(--castrol-green-border); color:var(--castrol-green-dark); }
    .inline-alert b { font-weight:700; }
    .inline-alert .alert-actions { display:flex; gap:12px; margin-top:6px; }
    .link-btn { background:none; border:none; padding:0; font-family:inherit; font-size:12px; font-weight:700; color:var(--castrol-green); text-decoration:underline; cursor:pointer; }

    /* photo check popup */
    .photo-check-card { text-align:center; }
    .check-badge { width:56px; height:56px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; }
    .check-badge.ok { background:var(--castrol-green); color:#fff; }
    .check-badge.bad { background:var(--castrol-red-soft); color:var(--castrol-red); border:1px solid var(--castrol-red-border); }
    .check-spinner { width:46px; height:46px; margin:4px auto 14px; border-radius:50%; border:4px solid #E5E7EB; border-top-color:var(--castrol-green); animation:spinA 0.9s linear infinite; }
    @keyframes spinA { to { transform:rotate(360deg); } }
    .photo-check-card h3 { font-size:17px; font-weight:700; margin-bottom:6px; }
    .photo-check-card p.sub { font-size:12.5px; color:#4B5563; line-height:1.45; margin-bottom:14px; }
    .check-steps { display:flex; flex-direction:column; gap:7px; text-align:left; margin-bottom:16px; background:#F9FAFB; border:1px solid var(--border-neutral); border-radius:12px; padding:10px 12px; }
    .check-step { display:flex; align-items:center; gap:8px; font-size:12.5px; color:#1F2937; }
    .check-step i { font-style:normal; width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; flex-shrink:0; }
    .check-step.ok i { background:var(--castrol-green); color:#fff; }
    .check-step.bad i { background:var(--castrol-red); color:#fff; }
    .check-step.bad { color:#991B1B; font-weight:600; }
    .check-step.pending { opacity:0; animation:fadeStep .35s ease forwards; }
    .check-step.pending i { background:var(--castrol-green); color:#fff; }
    @keyframes fadeStep { to { opacity:1; } }
    .modal-btn-stack { display:flex; flex-direction:column; gap:8px; }

    /* voice page */
    .script-card { border:1px solid var(--border-neutral); border-radius:14px; padding:12px 14px; background:#fff; display:flex; flex-direction:column; gap:8px; }
    .script-card-head { display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--castrol-green-dark); }
    .script-card-head span:last-child { color:var(--text-sub); letter-spacing:0; text-transform:none; font-weight:600; }
    .script-scroll { position:relative; max-height:90px; overflow-y:auto; font-size:14px; line-height:1.55; color:#9CA3AF; padding-right:4px; }
    .script-scroll.idle { color:#1F2937; }
    .script-scroll.live { max-height:190px; font-size:15px; }
    .script-phrase { transition:color .2s ease, background .2s ease; border-radius:4px; }
    .script-phrase.done { color:#1F2937; }
    .script-phrase.current { color:#004D21; background:#BCE6C4; font-weight:700; box-shadow:0 0 0 2px #BCE6C4; }

    .recorder-zone { display:flex; flex-direction:column; align-items:center; gap:8px; padding:0; }
    .mic-big { position:relative; width:72px; height:72px; border-radius:50%; border:none; background:var(--castrol-red); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 20px rgba(240,0,35,0.28); font-family:inherit; }
    .mic-big svg { width:28px; height:28px; }
    .mic-big.counting { background:#fff; color:var(--castrol-red); border:3px solid var(--castrol-red); font-size:34px; font-weight:800; box-shadow:none; }
    .mic-big.recording::before { content:""; position:absolute; inset:-10px; border-radius:50%; border:3px solid rgba(240,0,35,0.35); animation:pulseRing 1.3s ease-out infinite; }
    @keyframes pulseRing { from { transform:scale(0.9); opacity:1; } to { transform:scale(1.25); opacity:0; } }
    .mic-big .stop-square { width:26px; height:26px; border-radius:6px; background:#fff; }
    .mic-label { font-size:12.5px; font-weight:700; color:var(--text-main); }
    .rec-meta { width:100%; display:flex; flex-direction:column; gap:6px; }
    .rec-time-row { display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--castrol-red); font-variant-numeric:tabular-nums; }
    .rec-time-row span:last-child { color:var(--text-sub); font-weight:600; }
    .rec-track { position:relative; height:6px; border-radius:6px; background:#F3F4F6; overflow:visible; }
    .rec-track-fill { height:100%; width:0; border-radius:6px; background:var(--castrol-red); }
    .rec-marker { position:absolute; left:83.33%; top:-4px; width:2px; height:14px; background:var(--castrol-green); }
    .rec-marker-label { position:absolute; left:83.33%; top:12px; transform:translateX(-50%); font-size:9.5px; font-weight:700; color:var(--castrol-green-dark); }
    .level-meter { display:flex; align-items:center; justify-content:center; gap:3px; height:30px; margin-top:10px; }
    .level-meter span { width:4px; height:4px; border-radius:2px; background:var(--castrol-green); transition:height .1s ease; }
    .level-meter span.hot { background:var(--castrol-red); }
    .level-warn { font-size:11.5px; font-weight:700; text-align:center; min-height:16px; }
    .level-warn.ok { color:var(--castrol-green-dark); }
    .level-warn.warn { color:var(--castrol-red); }

    .player-row { width:100%; display:flex; align-items:center; gap:10px; border:1px solid var(--border-neutral); border-radius:12px; padding:10px 12px; background:#fff; }
    .play-btn-round { width:38px; height:38px; border-radius:50%; border:none; background:var(--castrol-green); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
    .play-btn-round svg { width:15px; height:15px; }
    .play-btn-round .pause-bars { display:flex; gap:3px; } .play-btn-round .pause-bars span { width:4px; height:13px; background:#fff; border-radius:1px; }
    .player-mid { flex:1; display:flex; flex-direction:column; gap:5px; min-width:0; }
    .player-name { font-size:12.5px; font-weight:700; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .player-track { height:4px; border-radius:4px; background:#E5E7EB; overflow:hidden; }
    .player-fill { height:100%; width:0; background:var(--castrol-green); }
    .player-time { font-size:10.5px; color:var(--text-sub); font-variant-numeric:tabular-nums; }
    .quality-chip { align-self:flex-start; padding:5px 10px; border-radius:99px; font-size:11.5px; font-weight:700; }
    .quality-chip.ok { background:var(--castrol-green-soft); color:var(--castrol-green-dark); border:1px solid var(--castrol-green-border); }
    .quality-chip.warn { background:#FFF7ED; color:#9A3412; border:1px solid #FED7AA; }
    .review-actions { width:100%; display:flex; gap:8px; }
    .review-actions button { flex:1; }

    .alt-actions { display:flex; flex-direction:column; align-items:center; gap:1px; }
    .alt-upload-btn { background:none; border:none; font-family:inherit; font-size:13px; font-weight:700; color:var(--castrol-green); cursor:pointer; display:inline-flex; align-items:center; gap:6px; padding:2px 0; }
    .alt-hint { font-size:11px; color:var(--text-sub); }

    .skip-zone { border-top:1px solid var(--border-neutral); padding-top:10px; display:flex; flex-direction:column; gap:4px; }
    .skip-zone .nudge { font-size:11.5px; color:var(--text-sub); line-height:1.4; }
    .skip-row { display:flex; justify-content:space-between; align-items:center; }
    .sample-btn { background:none; border:1px solid var(--border-neutral); border-radius:99px; padding:5px 11px; font-family:inherit; font-size:11.5px; font-weight:700; color:var(--text-main); cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
    .sample-btn svg { width:10px; height:10px; }
    .default-voice-card { border:1px solid var(--castrol-green-border); background:var(--castrol-green-soft); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; }
    .default-voice-card h4 { font-size:14px; font-weight:700; color:var(--castrol-green-dark); }
    .default-voice-card p { font-size:12px; color:#374151; line-height:1.45; }
    .default-voice-card .row { display:flex; gap:12px; align-items:center; margin-top:2px; }

    .name-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

    }

    function currentPhraseIndex(sec) {
      const per = 27 / SCRIPT_PHRASES.length;
      return Math.min(SCRIPT_PHRASES.length - 1, Math.floor(sec / per));

    // 3B. VOICE PAGE — tips → script → big mic → review; upload + default voice as alternatives
    function renderStep35() {

      const st = a.status;
      const isCounting = st === 'countdown';
      const isRec = st === 'recording';
      const hasVoice = st === 'review' || st === 'uploaded';
      const canStartFresh = ['idle', 'too_short', 'mic_denied', 'upload_error'].includes(st);
      const showScript = !['uploaded', 'skipped'].includes(st);
      const phraseIdx = isRec ? currentPhraseIndex(a.seconds) : -1;

      const tips = a.guidelinesOpen ? `
        <div class="tips-card">
          <div class="tips-head">
            <span>Before you record</span>
            <button class="guideline-close-x" onclick="toggleAudioGuidelines(false)" title="Hide tips">✕</button>

            <div class="tip-line"><b>3</b><span>Read the script below clearly at a normal pace.</span></div>
            <div class="tip-line"><b>4</b><span>Speak for 25–30 sec — recording stops at 30s.</span></div>

      const script = showScript ? `

        </div>
      ` : '';

      let recorder = '';
      if (canStartFresh) {
        recorder = `

          ${st === 'too_short' ? `<div class="inline-alert bad"><div><b>Too short (${fmtTime(a.duration)}).</b> Please record for at least 25 seconds so we can clone your voice.</div></div>` : ''}
          ${st === 'mic_denied' ? `<div class="inline-alert bad"><div><b>Microphone is blocked.</b> Allow microphone access in your browser settings and try again, or upload a recording instead.</div></div>` : ''}

            <button class="alt-upload-btn" onclick="pickAudioFile()">${ICONS.upload}<span>Upload an audio file instead</span></button>
            <span class="alt-hint">MP3 or M4A · 25–30 seconds</span>

                <div style="display:flex; flex-direction:column; gap:12px;">
                  <div class="list-option-card" style="cursor:pointer;" onclick="openMenuPage(5)">
                    <div class="list-option-text">
                      <h4>My Gallery</h4>
                      <p>View your personalised videos</p>
                    </div>
                  </div>

                  <div class="list-option-card" style="cursor:pointer;" onclick="openMenuPage(6)">
                    <div class="list-option-text">
                      <h4>How It Works</h4>
                      <p>Step-by-step instructions</p>
                    </div>
                  </div>

                  <div class="list-option-card" style="cursor:pointer;" onclick="openMenuPage(7)">
                    <div class="list-option-text">
                      <h4>Terms and Conditions</h4>
                      <p>Usage & participation rules</p>
                    </div>
                  </div>

                  <div class="list-option-card" style="cursor:pointer;" onclick="openMenuPage(8)">
                    <div class="list-option-text">
                      <h4>Privacy Policy</h4>
                      <p>Data & voice protection</p>
                    </div>
                  </div>
                </div>
              </div>

              <div style="font-size:11px; color:#9CA3AF; text-align:center;">
                Platform Title
              </div>
            </div>
          </div>
        `;
      }

      // NOTIFICATION POPUP MODAL (FOR DOWNLOAD, WHATSAPP, PLAYBACK)
      if (state.notificationModal) {
        html += `
          <div class="screen-modal-backdrop">
            <div class="modal-card" style="text-align:center;">
              <div style="display:flex; justify-content:flex-end; margin-bottom:2px;">
                <button class="modal-close-x" onclick="closeNotification()">✕</button>
              </div>
              <div class="upload-squircle" style="border-radius:50%; width:52px; height:52px; margin:0 auto 12px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <h3 style="font-size:17px; font-weight:700; color:var(--castrol-green); margin-bottom:6px;">
                ${state.notificationModal.title}
              </h3>
              <p style="font-size:13px; color:#374151; line-height:1.45; margin-bottom:16px;">
                ${state.notificationModal.message}
              </p>
              <button class="primary-cta" style="height:44px;" onclick="closeNotification()">
                OK
              </button>
            </div>
          </div>
        `;
      }

      // PHOTO CHECK RESULT POPUP
      if (state.photoCheck === 'checking') {
        html += `
          <div class="screen-modal-backdrop">
            <div class="modal-card photo-check-card">
              <div class="check-spinner"></div>
              <h3>Checking your photo</h3>
              <p class="sub">This only takes a few seconds.</p>
              <div class="check-steps">
                <div class="check-step pending" style="animation-delay:.2s"><i>✓</i>Face detected</div>
                <div class="check-step pending" style="animation-delay:.9s"><i>✓</i>Lighting and clarity</div>
                <div class="check-step pending" style="animation-delay:1.6s"><i>✓</i>Content moderation</div>
              </div>
            </div>
          </div>
        `;
      } else if (state.photoCheck === 'pass') {
        html += `
          <div class="screen-modal-backdrop">
            <div class="modal-card photo-check-card">
              <div style="display:flex; justify-content:flex-end;"><button class="modal-close-x" onclick="closePhotoCheck()">✕</button></div>
              <div class="check-badge ok">✓</div>
              <h3 style="color:var(--castrol-green);">Your photo looks good</h3>
              <p class="sub">It's clear, well lit and ready for your video.</p>
              <div class="check-steps">
                <div class="check-step ok"><i>✓</i>Face clearly visible</div>
                <div class="check-step ok"><i>✓</i>Good lighting and focus</div>
                <div class="check-step ok"><i>✓</i>Passed content moderation</div>
              </div>
              <div class="modal-btn-stack">
                <button class="primary-cta" style="height:46px;" onclick="photoCheckContinue()">Continue to voice</button>
                <button class="btn-secondary-outline" style="height:44px; font-size:13px;" onclick="photoCheckRetake()">Retake photo</button>
              </div>
            </div>
          </div>
        `;
      } else if (state.photoCheck === 'fail') {
        html += `
          <div class="screen-modal-backdrop">
            <div class="modal-card photo-check-card">
              <div style="display:flex; justify-content:flex-end;"><button class="modal-close-x" onclick="closePhotoCheck()">✕</button></div>
              <div class="check-badge bad">!</div>
              <h3 style="color:var(--castrol-red);">This photo can't be used</h3>
              <p class="sub">${state.photo.failReason}</p>
              <div class="check-steps">
                <div class="check-step bad"><i>✕</i>Face not clearly visible</div>
                <div class="check-step bad"><i>✕</i>Too dark or blurry</div>
                <div class="check-step ok"><i>✓</i>Passed content moderation</div>
              </div>
              <p class="sub" style="margin-top:-4px;">Tip: face a window or bright light and remove your cap or sunglasses.</p>
              <div class="modal-btn-stack">
                <button class="primary-cta" style="height:46px;" onclick="photoCheckRetake()">Retake photo</button>
                <button class="btn-secondary-outline" style="height:44px; font-size:13px;" onclick="photoCheckUploadAnother()">Upload another photo</button>
              </div>
            </div>
          </div>
        `;
      }

      // MIC PERMISSION PRE-PROMPT
      if (state.showMicPermission) {
        html += `
          <div class="screen-modal-backdrop">
            <div class="modal-card photo-check-card">
              <div style="display:flex; justify-content:flex-end;"><button class="modal-close-x" onclick="dismissMicPermission()">✕</button></div>
              <div class="check-badge bad" style="background:var(--castrol-red-soft);">${ICONS.mic}</div>
              <h3>Allow microphone access</h3>
              <p class="sub">We need your microphone to record your 25–30 second voice clip. It's only used to create your video.</p>
              <p class="sub" style="margin-top:-6px; font-weight:600; color:#111827;">Your phone will ask next — tap <b>Allow</b>.</p>
              <div class="modal-btn-stack">
                <button class="primary-cta" style="height:46px;" onclick="allowMicAccess()">Allow microphone</button>
                <button class="btn-secondary-outline" style="height:44px; font-size:13px;" onclick="dismissMicPermission()">Not now</button>
              </div>
            </div>
          </div>
        `;
      }

      return html;
    }

    function render() {
      const appEl = document.getElementById('appScreen');
      if (state.isLoading) {
        appEl.innerHTML = renderBrandLoadingScreen();
        return;
      }
      if (state.step === 1) appEl.innerHTML = renderStep1();
      else if (state.step === 2) appEl.innerHTML = renderStep2();
      else if (state.step === 3) appEl.innerHTML = renderStep3();
      else if (state.step === 35) appEl.innerHTML = renderStep35();
      else if (state.step === 4) appEl.innerHTML = renderStep4();
      else if (state.step === 5) appEl.innerHTML = renderStep5();
      else if (state.step === 6) appEl.innerHTML = renderStep6();
      else if (state.step === 7) appEl.innerHTML = renderStep7();
      else if (state.step === 8) appEl.innerHTML = renderStep8();
    }

    function triggerBrandLoader(headline, subcopy, nextStep, openHowItWorksAfter = false) {
      state.isLoading = true;
      state.loadingHeadline = headline;
      state.loadingSubcopy = subcopy;
      render();
      setTimeout(() => {
        state.isLoading = false;
        state.step = nextStep;
        if (openHowItWorksAfter) {
          state.showInstructionsPopup = true;
        }
        render();
      }, 1100);
    }

    function goToStep(stepNum) {
      cleanupAudioCapture();
      state.photoCheck = null;
      state.showMicPermission = false;
      state.showInstructionsPopup = false;
      state.showModerationChecklistPopup = false;
      state.showLimitModal = false;
      state.showMenuDrawer = false;
      state.photoModal = null;
      state.step = stepNum;
      render();
    }

    function openMenuPage(targetStep) {
      if ((state.step >= 2 && state.step <= 4) || state.step === 35) {
        state.previousStep = state.step;
      }
      state.showMenuDrawer = false;
      state.showInstructionsPopup = false;
      state.showModerationChecklistPopup = false;
      state.showLimitModal = false;
      state.step = targetStep;
      render();
    }

    function handleFormInput(field, val) {
      const maxLen = FIELD_LIMITS[field] || 100;
      if (field === 'whatsapp') {
        val = val.replace(/[^0-9]/g, '');
      }
      state.form[field] = val.slice(0, maxLen);
      const anyProfane = ['firstName', 'lastName', 'workshopName', 'workshopAddress'].some(k => checkProfanityText(state.form[k]));
      state.form.profanityError = anyProfane;
      render();
    }

    function toggleConsent(key) {
      state.form[key] = !state.form[key];
      render();
    }

    function submitStep2() {
      triggerBrandLoader(
        'Verifying your details',
        'Running text moderation and preparing your recording studio...',
        3,
        true
      );
    }

    function closeInstructionsToStep3() {
      state.showInstructionsPopup = false;
      state.step = 3;
      render();
    }

    function openModerationChecklist() {
      state.showInstructionsPopup = false;
      state.showMenuDrawer = false;
      state.photoModal = null;
      state.showModerationChecklistPopup = true;
      render();
    }

    function closeModerationChecklist() {
      state.showModerationChecklistPopup = false;
      render();
    }

    function confirmChecklistAndSubmit() {
      state.showModerationChecklistPopup = false;
      if (state.videosGenerated >= state.maxVideos) { toggleLimitModal(true); return; }
      state.videosGenerated += 1;
      triggerBrandLoader(
        'Accelerating your video',
        'Cloning your voice and animating your personalised workshop video...',
        4,
        false
      );
    }

    function openPhotoModal(type) {
      if (type === 'gallery') { state.photo.source = 'gallery'; type = 'crop'; }
      else if (type === 'camera') { state.photo.source = 'camera'; }
      state.photoCheck = null;
      state.photoModal = type;
      render();
    }

    function closePhotoModal() {
      state.photoModal = null;
      render();
    }

    function captureFromCamera() {
      state.photoModal = 'crop';
      render();
    }

    function updateCropZoom(val) {
      state.cropZoom = parseFloat(val);
      render();
    }

    function applyPhotoCrop() {
      state.photoModal = null;
      runPhotoCheck();
    }

    // Prototype moderation: the first gallery upload fails (dark/blurry) to show the rejection path; everything else passes.
    function runPhotoCheck() {
      state.photo.status = 'checking';
      state.photoCheck = 'checking';
      render();
      setTimeout(() => {
        if (state.photo.status !== 'checking') return;
        const shouldFail = state.photo.source === 'gallery' && !state.photo.galleryFailedOnce;
        if (shouldFail) {
          state.photo.galleryFailedOnce = true;
          state.photo.status = 'failed';
          state.photo.failReason = "We couldn't see your face clearly — the photo looks too dark or blurry.";
          state.photoCheck = 'fail';
        } else {
          state.photo.status = 'passed';
          state.photo.guidelinesOpen = false;
          state.photoCheck = 'pass';
        }
        render();
      }, 2300);
    }

    function closePhotoCheck() { state.photoCheck = null; render(); }
    function photoCheckContinue() { state.photoCheck = null; goToStep(35); }
    function photoCheckRetake() { state.photoCheck = null; openPhotoModal('camera'); }
    function photoCheckUploadAnother() { state.photoCheck = null; openPhotoModal('gallery'); }

    function deletePhoto() {
      state.photo.status = 'empty';
      state.photo.guidelinesOpen = true;
      render();
    }

    function togglePhotoGuidelines(open) {
      state.photo.guidelinesOpen = open;
      render();
    }

    function toggleAudioGuidelines(open) {
      state.audio.guidelinesOpen = open;
      render();
    }

    // ---------- VOICE CAPTURE ----------
    let recInterval = null, countInterval = null, playInterval = null;
    let mediaStream = null, mediaRecorder = null, recChunks = [];
    let audioCtx = null, analyser = null, levelData = null, playbackAudio = null;
    let quietTicks = 0, noisyTicks = 0;

    function $id(id) { return document.getElementById(id); }

    function stopMediaStream() {
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; analyser = null; }
    }

    function clearAudioTimers() {
      clearInterval(recInterval); clearInterval(countInterval); clearInterval(playInterval);
      recInterval = countInterval = playInterval = null;
      if (playbackAudio) { playbackAudio.pause(); playbackAudio = null; }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      state.audio.playing = false;
      state.audio.samplePlaying = false;
    }

    function cleanupAudioCapture() {
      clearAudioTimers();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.onstop = null; try { mediaRecorder.stop(); } catch (e) {} }
      mediaRecorder = null;
      stopMediaStream();
      if (['recording', 'countdown'].includes(state.audio.status)) state.audio.status = 'idle';
    }

    function startRecordFlow() {
      cleanupAudioCapture();
      if (!state.audio.micAsked) {
        state.showMicPermission = true;
        render();
        return;
      }
      requestMicThenCount();
    }

    function allowMicAccess() {
      state.showMicPermission = false;
      state.audio.micAsked = true;
      requestMicThenCount();
    }

    function dismissMicPermission() {
      state.showMicPermission = false;
      render();
    }

    function requestMicThenCount() {
      const embedded = window.self !== window.top || !window.isSecureContext;
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          mediaStream = stream;
          beginCountdown();
        }).catch(err => {
          const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
          if (denied && !embedded) { state.audio.status = 'mic_denied'; render(); }
          else { beginCountdown(); } // no usable mic (e.g. desktop preview) — simulate capture
        });
      } else {
        beginCountdown();
      }
    }

    function beginCountdown() {
      state.audio.status = 'countdown';
      state.audio.countdown = 3;
      render();
      countInterval = setInterval(() => {
        state.audio.countdown -= 1;
        if (state.audio.countdown > 0) {
          const c = $id('micCount'); if (c) c.textContent = state.audio.countdown;
        } else {
          clearInterval(countInterval); countInterval = null;
          startRecording();
        }
      }, 1000);
    }

    function cancelCountdown() {
      cleanupAudioCapture();
      state.audio.status = 'idle';
      render();
    }

    function startRecording() {
      const a = state.audio;
      if (a.blobUrl) { URL.revokeObjectURL(a.blobUrl); a.blobUrl = null; }
      a.status = 'recording';
      a.seconds = 0;
      a.guidelinesOpen = false;
      quietTicks = 0; noisyTicks = 0; recChunks = [];

      if (mediaStream) {
        try {
          mediaRecorder = new MediaRecorder(mediaStream);
          mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
          mediaRecorder.start();
        } catch (e) { mediaRecorder = null; }
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
          const srcNode = audioCtx.createMediaStreamSource(mediaStream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          levelData = new Uint8Array(analyser.fftSize);
          srcNode.connect(analyser);
        } catch (e) { analyser = null; }
      }

      render();
      const t0 = Date.now();
      recInterval = setInterval(() => {
        a.seconds = (Date.now() - t0) / 1000;
        updateRecordingUI();
        if (a.seconds >= 30) stopRecording();
      }, 100);
    }

    function updateRecordingUI() {
      const s = state.audio.seconds;
      const t = $id('recTime'); if (t) t.textContent = '● ' + fmtTime(s);
      const f = $id('recFill'); if (f) f.style.width = Math.min(100, s / 30 * 100) + '%';

      const idx = currentPhraseIndex(s);
      const phrases = document.querySelectorAll('.script-phrase');
      phrases.forEach((p, i) => { p.classList.toggle('done', i < idx); p.classList.toggle('current', i === idx); });
      const box = $id('scriptBox');
      const cur = phrases[idx];
      if (box && cur) {
        const target = Math.max(0, cur.offsetTop - 28);
        if (Math.abs(box.scrollTop - target) > 4) box.scrollTo({ top: target, behavior: 'smooth' });
      }

      let level;
      if (analyser) {
        analyser.getByteTimeDomainData(levelData);
        let sum = 0;
        for (let i = 0; i < levelData.length; i++) { const d = (levelData[i] - 128) / 128; sum += d * d; }
        level = Math.min(1, Math.sqrt(sum / levelData.length) * 5);
      } else {
        level = (s > 4 && s < 6.5) ? 0.06 + Math.random() * 0.05 : 0.35 + Math.random() * 0.5;
      }
      document.querySelectorAll('#levelMeter span').forEach((b, i) => {
        const shape = 0.55 + 0.45 * Math.sin((i / 15) * Math.PI);
        b.style.height = (4 + level * 26 * shape * (0.7 + Math.random() * 0.5)) + 'px';
        b.classList.toggle('hot', level > 0.95);
      });

      if (level < 0.15) quietTicks++; else quietTicks = Math.max(0, quietTicks - 2);
      if (level > 0.95) noisyTicks++;
      const w = $id('levelWarn');
      if (w) {
        if (quietTicks > 10) { w.textContent = 'Too quiet — speak a little louder'; w.className = 'level-warn warn'; }
        else if (level > 0.95) { w.textContent = 'Too loud or noisy — move away from machines'; w.className = 'level-warn warn'; }
        else if (s >= 25) { w.textContent = 'Great — you can stop now'; w.className = 'level-warn ok'; }
        else { w.textContent = 'Good level — keep going'; w.className = 'level-warn ok'; }
      }
    }

    function stopRecording() {
      clearInterval(recInterval); recInterval = null;
      const a = state.audio;
      const dur = a.seconds;
      const finish = (url) => {
        stopMediaStream();
        a.blobUrl = url || null;
        a.duration = dur;
        if (dur < 25) { a.status = 'too_short'; }
        else { a.status = 'review'; a.quality = noisyTicks > 25 ? 'noisy' : 'ok'; }
        render();
      };
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        const rec = mediaRecorder;
        rec.onstop = () => {
          const blob = new Blob(recChunks, { type: rec.mimeType || 'audio/webm' });
          finish(blob.size ? URL.createObjectURL(blob) : null);
        };
        mediaRecorder = null;
        rec.stop();
      } else {
        finish(null);
      }
    }

    function togglePlayback() {
      const a = state.audio;
      if (a.playing) { clearAudioTimers(); render(); return; }
      clearAudioTimers();
      a.playing = true;
      render();
      const dur = a.duration || 28;
      if (a.blobUrl) {
        playbackAudio = new Audio(a.blobUrl);
        playbackAudio.play().catch(() => {});
        playbackAudio.onended = () => { clearAudioTimers(); render(); };
      }
      const t0 = Date.now();
      playInterval = setInterval(() => {
        const t = playbackAudio ? playbackAudio.currentTime : (Date.now() - t0) / 1000;
        const f = $id('playFill'); if (f) f.style.width = Math.min(100, t / dur * 100) + '%';
        const tt = $id('playTime'); if (tt) tt.textContent = fmtTime(t) + ' / ' + fmtTime(dur);
        if (!playbackAudio && t >= dur) { clearAudioTimers(); render(); }
      }, 150);
    }

    function pickAudioFile() {
      const i = $id('audioFileInput');
      if (i) { i.value = ''; i.click(); }
    }

    function setUploadError(msg) {
      state.audio.status = 'upload_error';
      state.audio.uploadError = msg;
      render();
    }

    function acceptUpload(file, url, dur) {
      const a = state.audio;
      if (a.blobUrl) URL.revokeObjectURL(a.blobUrl);
      a.status = 'uploaded';
      a.fileName = file.name;
      a.blobUrl = url;
      a.duration = dur;
      a.quality = 'ok';
      render();
    }

    function handleAudioFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      cleanupAudioCapture();
      const okType = /\.(mp3|m4a|aac|wav)$/i.test(file.name) || /audio\/(mpeg|mp4|x-m4a|aac|wav)/.test(file.type);
      if (!okType) { setUploadError('Unsupported file type. Please upload an MP3 or M4A file.'); return; }
      if (file.size > 15 * 1024 * 1024) { setUploadError('This file is too large. Please upload a file under 15 MB.'); return; }
      const url = URL.createObjectURL(file);
      const probe = new Audio();
      probe.preload = 'metadata';
      probe.onloadedmetadata = () => {
        const d = probe.duration;
        if (!isFinite(d)) { acceptUpload(file, url, 28); return; }
        if (d < 25) { URL.revokeObjectURL(url); setUploadError(`This recording is only ${fmtTime(d)} long. Please upload a 25–30 second clip.`); }
        else if (d > 30.5) { URL.revokeObjectURL(url); setUploadError(`This recording is ${fmtTime(d)} long. Please trim it to 25–30 seconds.`); }
        else acceptUpload(file, url, d);
      };
      probe.onerror = () => acceptUpload(file, url, 28);
      probe.src = url;
    }

    function playDefaultSample() {
      const a = state.audio;
      if (a.samplePlaying) { window.speechSynthesis && window.speechSynthesis.cancel(); a.samplePlaying = false; render(); return; }
      if (!('speechSynthesis' in window)) {
        showNotification('Default voice sample', 'Sample playback is not supported on this browser.');
        return;
      }
      const workshop = state.form.workshopName.trim() || 'our workshop';
      const u = new SpeechSynthesisUtterance(`Namaste! Welcome to ${workshop}. Trust Castrol Magnatec to protect your engine from the moment you start.`);
      u.lang = 'en-IN';
      u.rate = 0.95;
      u.onend = () => { a.samplePlaying = false; render(); };
      a.samplePlaying = true;
      window.speechSynthesis.speak(u);
      render();
    }

    function skipAudio() {
      cleanupAudioCapture();
      state.audio.status = 'skipped';
      render();
    }

    function resetAudio() {
      cleanupAudioCapture();
      const a = state.audio;
      if (a.blobUrl) { URL.revokeObjectURL(a.blobUrl); a.blobUrl = null; }
      a.status = 'idle';
      a.fileName = '';
      a.seconds = 0;
      a.duration = 0;
      render();
    }

    function generateFromAudio() {
      cleanupAudioCapture();
      if (!['review', 'uploaded'].includes(state.audio.status)) state.audio.status = 'skipped';
      confirmChecklistAndSubmit();
    }

    function toggleWhatsAppOptIn() {
      state.whatsappOptIn = !state.whatsappOptIn;
      render();
    }

    function toggleDrawer(open) {
      state.showMenuDrawer = open;
      render();
    }

    function showNotification(title, message) {
      state.notificationModal = { title, message };
      render();
    }

    function closeNotification() {
      state.notificationModal = null;
      render();
    }

    function toggleLimitModal(open) {
      state.showInstructionsPopup = false;
      state.showModerationChecklistPopup = false;
      state.showMenuDrawer = false;
      state.photoModal = null;
      state.showLimitModal = open;
      render();
    }

    function handleCreateAnotherClick() {
      if (state.videosGenerated >= state.maxVideos) {
        toggleLimitModal(true);
      } else {
        state.photo.status = 'empty';
        state.photo.guidelinesOpen = true;
        if (state.audio.blobUrl) { URL.revokeObjectURL(state.audio.blobUrl); state.audio.blobUrl = null; }
        state.audio.status = 'idle';
        state.audio.guidelinesOpen = true;
        goToStep(3);
      }
    }

    render();
  </script>
</body>
</html>
